<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordex Paged</title>
    <style id="wordex-page-at-rule-runtime"></style>
    <style id="wordex-report-styles">
/* Wordex: CSS essencial do relatório paginado */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #222;
  background: white;
}

html {
  height: 100%;
}

body.wordex-generated-report {
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 100%;
  background: #d8d8d8;
}

.workspace {
  padding: 0;
}

.document {
  position: relative;
  margin: 0 auto;
  background: white;
  box-shadow: none;
  overflow: hidden;
  box-sizing: border-box;
}

body.wordex-generated-report #wordex-report-source .document {
  width: var(--wordex-page-width, 210mm) !important;
  min-height: var(--wordex-page-height, 297mm);
}

body.wordex-generated-report .document {
  width: auto !important;
  min-height: 0 !important;
  max-width: 100%;
}

.region {
  position: relative;
  box-sizing: border-box;
}

body.wordex-generated-report #wordex-report-source .region {
  padding-top: 4mm;
  padding-bottom: 4mm;
  padding-left: var(--wordex-margin-left, 14mm);
  padding-right: var(--wordex-margin-right, 14mm);
}

body.wordex-generated-report .pagex-page .region {
  padding: 0 !important;
}

body.wordex-generated-report #wordex-report-source .pagex-body .body-flow,
body.wordex-generated-report .pagex-body .body-flow {
  padding-left: 0 !important;
  padding-right: 0 !important;
}

body.wordex-generated-report .document > .region::before {
  display: none !important;
  content: "" !important;
}

.header-template,
.footer-template {
  height: auto;
  min-height: 0;
  max-height: none;
  overflow: visible;
  background: transparent;
}

.body-flow {
  min-height: 0;
}

.paragraph-block,
.object-block {
  margin: 8px 0;
  position: relative;
  padding: 2px;
}

.object-block {
  display: flow-root;
  min-height: 0;
}

.paragraph {
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  width: 100%;
  gap: 4px;
  min-height: 1.15em;
  line-height: 1.15;
  box-sizing: border-box;
}

.subparagraph {
  position: relative;
  display: flow-root;
  flex: 1 1 0;
  min-width: 0;
  min-height: 1.15em;
  line-height: 1.15;
  white-space: pre-wrap;
  box-sizing: border-box;
  overflow: visible;
}

.subparagraph[data-content-kind="Object"] {
  padding: 0;
  white-space: normal;
}

.wordex-list-items {
  box-sizing: border-box;
  width: 100%;
  margin: 0;
  padding: 4px 4px 4px 28px;
  color: #222;
  font: inherit;
  line-height: 1.35;
  text-align: left;
}

.wordex-list-items li {
  padding: 1px 2px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.wordex-list-items.is-outline {
  list-style: none;
  padding-left: 4px;
}

.wordex-list-items.is-outline > li {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 0.35em;
  align-items: start;
}

.wordex-list-items.is-outline > li > .wordex-list-marker {
  grid-column: 1;
  white-space: nowrap;
  user-select: none;
}

.wordex-list-items.is-outline > li > .wordex-list-item-text {
  grid-column: 2;
  min-width: 0;
}

.wordex-list-items.is-outline > li > .wordex-inline-list {
  grid-column: 2;
}

.wordex-inline-list[data-justify="true"] > .wordex-list-items > li {
  text-align: justify;
}

.wordex-inline-list[data-justify="true"] > .wordex-list-items.is-outline > li > .wordex-list-item-text {
  text-align: justify;
}

.wordex-list-items[role="list"] {
  display: block;
}

.wordex-list-items[role="list"] > [role="listitem"] {
  display: list-item;
  padding: 1px 2px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.wordex-inline-list {
  position: relative;
  z-index: 2;
  display: block;
  box-sizing: border-box;
  width: fit-content;
  min-width: 0;
  max-width: 100%;
  margin: 0 8px 8px 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: #222;
}

.wordex-inline-list.wordex-sub-list {
  position: static;
  float: none;
  clear: none;
  width: fit-content;
  max-width: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
}

.wordex-inline-list[data-alignment="left"] {
  margin: 8px auto 8px 0;
}

.wordex-inline-list[data-alignment="right"] {
  margin: 8px 0 8px auto;
}

.wordex-inline-list[data-alignment="left"][data-wrap-text="true"] {
  float: left;
  margin: 0 8px 8px 0;
}

.wordex-inline-list[data-alignment="right"][data-wrap-text="true"] {
  float: right;
  margin: 0 0 8px 8px;
}

.wordex-inline-list[data-alignment="center"] {
  float: none;
  clear: both;
  width: fit-content;
  min-width: 0;
  max-width: 100%;
  margin: 8px auto;
}

.wordex-inline-line {
  display: inline;
  white-space: pre;
}

/* Caixa flutuante sobre gráfico/tabela/imagem: mantém left/top do editor. */
.textbox:not(.textbox-inline) {
  position: absolute;
  z-index: 4;
  box-sizing: border-box;
  border: 1px solid #b36b00;
  border-radius: 4px;
  background: rgba(255, 255, 255, .88);
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0, 0, 0, .12);
}

.textbox:not(.textbox-inline) .textbox-content {
  box-sizing: border-box;
  padding: 4px;
  outline: none;
  font: inherit;
  line-height: 1.25;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.textbox-inline {
  position: relative;
  display: flex;
  box-sizing: border-box;
  max-width: 100%;
  overflow: hidden;
  border: 1px solid #b36b00;
  border-radius: 4px;
  background: rgba(255, 255, 255, .88);
  vertical-align: middle;
}

.textbox-inline .textbox-content {
  display: block;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  padding: 4px;
  overflow: auto;
  white-space: pre-wrap;
  font: inherit;
}

.textbox-inline[data-alignment="left"] {
  float: left;
  margin: 0 8px 8px 0;
}

.textbox-inline[data-alignment="right"] {
  float: right;
  margin: 0 0 8px 8px;
}

.textbox-inline[data-alignment="center"] {
  display: flex;
  float: none;
  clear: both;
  width: fit-content;
  margin: 8px auto;
}

.object-area {
  position: relative;
  display: flex;
  align-items: flex-start;
  width: 100%;
  min-height: 0;
  height: auto;
  overflow: visible;
}

.object-area[data-object-align="center"] > .main-object {
  margin-left: auto;
  margin-right: auto;
}

.object-area[data-object-align="right"] > .main-object {
  margin-left: auto;
  margin-right: 0;
}

.object-area[data-object-align="left"] > .main-object {
  margin-left: 0;
  margin-right: auto;
}

.main-object {
  position: relative;
  display: flex;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  min-height: 0;
  max-width: 100%;
  padding: 0;
}

.main-object[data-object-kind="Image"] {
  align-items: stretch;
  justify-content: stretch;
  overflow: hidden;
}

.wordex-rendered-image {
  display: block;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.paragraph::after {
  content: "";
  display: block;
  clear: both;
}

.paragraph.is-empty::before,
.wordex-textbox:empty::before {
  content: "" !important;
}

.dynamic-image-box {
  display: flex;
  align-items: center;
  justify-content: center;
  max-width: 100%;
  text-align: center;
  overflow: hidden;
  box-sizing: border-box;
}

body.wordex-generated-report .object-block,
body.wordex-generated-report .paragraph-block {
  overflow: visible;
}

body.wordex-generated-report .dynamic-image-box {
  overflow: visible;
}

.dynamic-image-box img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

.dynamic-image-box strong {
  display: none !important;
}

.wordex-chart-box strong {
  display: block;
  margin-bottom: 4px;
  font-size: 14px;
  color: #333;
}

.wordex-chart-box {
  display: flex;
  flex-direction: column;
  position: relative;
  max-width: 100%;
  border: 1px solid #000;
  text-align: center;
  overflow: hidden;
  contain: layout paint;
  clear: both;
}

.wordex-chart-label {
  display: block;
  flex: 0 0 auto;
  line-height: 1.2;
  margin-bottom: 4px;
  font-size: 12px;
}

.wordex-chart-label strong {
  font-size: 13px;
  margin-bottom: 2px;
}

.wordex-chart-preview {
  display: flex;
  flex: 1 1 auto;
  position: relative;
  min-height: 0;
  width: 100%;
  align-items: stretch;
  justify-content: center;
  overflow: hidden;
}

.wordex-chart-preview svg {
  width: 100%;
  height: 100%;
  display: block;
}

.wordex-chart-legend-panel {
  position: absolute;
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  text-align: left;
  white-space: nowrap;
  pointer-events: none;
}

.wordex-chart-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.wordex-chart-legend-swatch {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
}

.wordex-chart-value-labels,
.wordex-chart-category-labels {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: visible;
}

.wordex-chart-value-label {
  position: absolute;
  white-space: nowrap;
  line-height: 1.1;
  pointer-events: none;
  text-align: center;
  writing-mode: horizontal-tb;
  text-orientation: mixed;
  transform: translate(-50%, -50%) rotate(270deg);
  transform-origin: center center;
}

.wordex-chart-value-label.is-hidden {
  visibility: hidden;
}

.wordex-chart-category-label {
  position: absolute;
  white-space: nowrap;
  line-height: 1.1;
  pointer-events: none;
  text-align: center;
  transform: translate(-50%, 0);
  transform-origin: center top;
  max-width: 7em;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wordex-chart-box script.wordex-chart-data {
  display: none !important;
}

table.wordex-table {
  width: 100%;
  max-width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  background: white;
}

.wordex-table td {
  border: 1px solid #444;
  padding: 5px;
  min-width: 12mm;
  min-height: 7mm;
  vertical-align: top;
}

.wordex-table.wordex-show-gridlines td {
  outline: 1px dotted #8aa9d6;
  outline-offset: -1px;
}

.wordex-textbox {
  display: inline-block;
  max-width: 100%;
  min-width: 8mm;
  min-height: 1.55em;
  padding: 2px 4px;
  border: none;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.4);
  color: #222;
  font-size: 12pt;
  line-height: 1.25;
  overflow: auto;
  white-space: pre-wrap;
  text-align: left;
}

[data-align="free"] {
  cursor: default;
}

.wordex-continuous-watermark {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  user-select: none;
  text-align: center;
  overflow: visible;
}

.wordex-continuous-watermark img {
  display: block;
  width: auto;
  height: auto;
  max-height: 80%;
  object-fit: contain;
}

body.wordex-generated-report .wordex-continuous-watermark {
  position: absolute;
  inset: 0;
  left: 0;
  top: 0;
  z-index: 0;
  transform: none;
}

.document-title,
.empty,
.wordex-table tr[data-wordex-row-type] td:first-child::before {
  display: none !important;
}

.region,
.region:hover,
.region.selected,
.paragraph,
.paragraph:hover,
.paragraph:focus,
.paragraph-block,
.object-block,
.paragraph-block.selected-block,
.object-block.selected-block,
.selected-object,
.selected-cell,
.selected-row-cell,
.selected-column-cell,
.wordex-textbox {
  outline: none !important;
  box-shadow: none !important;
  background-image: none !important;
}

body.wordex-generated-report .wordex-atomic-block,
body.wordex-generated-report .wordex-atomic-object {
  break-inside: avoid;
  page-break-inside: avoid;
}

body.wordex-generated-report .wordex-atomic-block {
  display: flow-root;
}

body.wordex-generated-report .wordex-paginable-table {
  break-inside: auto;
  page-break-inside: auto;
}

body.wordex-generated-report .wordex-paginable-table tr,
body.wordex-generated-report .wordex-paginable-table td {
  break-inside: avoid;
  page-break-inside: avoid;
}

.wordex-table-slice,
.wordex-table-slice .paragraph,
.wordex-table-slice .subparagraph,
.wordex-table-slice .object-area,
.wordex-table-slice .main-object {
  height: auto !important;
  min-height: 0 !important;
  max-height: none !important;
}

body.wordex-generated-report .pagex-body {
  background: transparent;
}

body.wordex-generated-report table.wordex-table {
  background: transparent !important;
}

body.wordex-generated-report table.wordex-table td,
body.wordex-generated-report table.wordex-table th {
  background: transparent;
}

@page { size: A4 portrait; margin: 0; }

.wordex-paged-toolbar {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid #b8c9de;
  background: linear-gradient(#f4f8fd, #e6eef8);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
  font-family: "Segoe UI", Arial, sans-serif;
}

.wordex-paged-toolbar-title {
  flex: 1 1 auto;
  min-width: 120px;
  font-size: 13px;
  font-weight: 600;
  color: #444;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wordex-paged-toolbar-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.wordex-paged-status {
  flex: 0 0 100%;
  font-size: 12px;
  color: #555;
  line-height: 1.4;
}

.wordex-paged-status.is-error {
  color: #900;
}

.wordex-paged-stage {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
}

.wordex-paged-toolbar button {
  border: 1px solid #bdbdbd;
  border-radius: 4px;
  background: #f8f8f8;
  padding: 6px 12px;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  line-height: 1.2;
}

.wordex-paged-toolbar button.primary {
  background: #eaf2ff;
  border-color: #b8cff5;
  font-weight: 600;
}

.wordex-paged-toolbar button:hover:not(:disabled) {
  background: #eaf2ff;
  border-color: #9ebbe8;
}

.wordex-paged-toolbar button:disabled {
  opacity: .55;
  cursor: wait;
}

@media print {
  .wordex-paged-toolbar {
    display: none !important;
  }

  .wordex-paged-stage {
    overflow: visible !important;
  }
}

/* Gráficos no paginado não cortam labels/legendas posicionados por overlay. */
body.wordex-generated-report .wordex-chart-box {
  overflow: visible !important;
  contain: none !important;
}

body.wordex-generated-report .wordex-chart-preview {
  overflow: visible !important;
}

body.wordex-generated-report .wordex-chart-value-labels,
body.wordex-generated-report .wordex-chart-category-labels,
body.wordex-generated-report .wordex-chart-legend-panel {
  overflow: visible !important;
}

body.wordex-generated-report .wordex-chart-value-label {
  display: inline-block;
}

body.wordex-generated-report .wordex-chart-value-label.is-horizontal-bar {
  transform: translate(0, -50%);
  transform-origin: left center;
}

body.wordex-generated-report .wordex-chart-value-label.is-horizontal-stacked,
body.wordex-generated-report .wordex-chart-value-label.is-vertical-stacked {
  transform: translate(0, -100%);
  transform-origin: left top;
}

</style>
  </head>
  <body class="wordex-generated-report">
    <div class="wordex-paged-toolbar" id="wordex-paged-toolbar">
      <div class="wordex-paged-toolbar-title" id="wordex-paged-title">Wordex Paged</div>
      <div class="wordex-paged-toolbar-actions">
        <button type="button" id="wordex-paged-save-html" disabled title="Salvar HTML montado">Salvar HTML</button>
        <button type="button" id="wordex-paged-print" disabled title="Imprimir relatório">Imprimir</button>
        <button type="button" id="wordex-paged-pdf" class="primary" disabled title="Gerar PDF">Gerar PDF</button>
        <button type="button" id="wordex-paged-close" title="Fechar">Fechar</button>
      </div>
      <div class="wordex-paged-status" id="wordex-paged-status">Aguardando o Wordex...</div>
    </div>
    <div class="wordex-paged-stage" id="wordex-paged-stage">
      <div id="wordex-report-source" class="workspace">
        
      </div>
      <div id="wordex-pagex-output"></div>
    </div>
    <script type="application/json"
      id="wordex-pagex-config">{}</script>
    <script id="wordex-pdf-template-loader" src="js/wordex-pdf-template.js"></script>
    <script>
    (function () {
      var loader = document.getElementById("wordex-pdf-template-loader");
      var source = String(window.WORDEX_PDF_TEMPLATE_BOOT_SOURCE || "");
      if (!loader || !source) return;
      var boot = document.createElement("script");
      boot.id = "wordex-pdf-template-boot";
      boot.textContent = source;
      loader.replaceWith(boot);
    }());
    </script>
    <script>
    window.initializeWordexPaged = function (config, alreadyPaged) {
      config = config || {};
      var headerTemplateHtml = config.headerTemplateHtml || "";
      var footerTemplateHtml = config.footerTemplateHtml || "";
      var watermarkConfig = config.watermarkConfig || null;
      var pageConfig = config.pageConfig || {};
      var pagedTitleNode = document.getElementById("wordex-paged-title");
      var pagedStatusNode = document.getElementById("wordex-paged-status");
      var pagedTitle = String(config.pdfTitle || document.title || "Relatório Wordex").trim();

      if (pagedTitleNode) {
        pagedTitleNode.textContent = pagedTitle;
      }

      document.title = pagedTitle;

      function setPagedStatus(message, isError) {
        if (!pagedStatusNode) return;
        pagedStatusNode.textContent = message;
        pagedStatusNode.classList.toggle("is-error", !!isError);
      }

      function mm(value) {
        return Math.max(0, Number(value) || 0).toFixed(2).replace(/\.?0+$/, "") + "mm";
      }

      function htmlToElement(html) {
        if (!html) return null;
        var tpl = document.createElement("template");
        tpl.innerHTML = String(html || "").trim();
        return tpl.content.firstElementChild;
      }

      function waitForImages(node, timeoutMs) {
        var images = node ? Array.prototype.slice.call(node.querySelectorAll("img")) : [];
        if (!images.length) return Promise.resolve();
        var tasks = images.map(function (img) {
          if (img.complete) return Promise.resolve();
          return new Promise(function (resolve) {
            function done() {
              img.removeEventListener("load", done);
              img.removeEventListener("error", done);
              resolve();
            }
            img.addEventListener("load", done, { once: true });
            img.addEventListener("error", done, { once: true });
          });
        });
        return Promise.race([
          Promise.allSettled(tasks),
          new Promise(function (resolve) {
            setTimeout(resolve, timeoutMs || 8000);
          })
        ]).then(function () {});
      }

      function waitForResources(node) {
        var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
        return Promise.race([
          Promise.allSettled([fontsReady, waitForImages(node, 8000)]),
          new Promise(function (resolve) {
            setTimeout(resolve, 8000);
          })
        ]).then(function () {});
      }

      function addPagexCss() {
        var style = document.createElement("style");
        style.id = "wordex-pagex-style";
        var pageHeight = pageConfig.height || "297mm";
        style.textContent = [
          "body.wordex-generated-report { margin:0; background:#d8d8d8; }",
          "#wordex-report-source { display:none !important; }",
          "#wordex-pagex-output { display:block; }",
          ".pagex-pages { display:flex; flex-direction:column; align-items:center; gap:18px; padding:18px 0; background:#d8d8d8; }",
          ".pagex-page { position:relative; width:" + pageConfig.width + "; height:" + pageHeight + "; background:white; box-shadow:0 0 10px rgba(0,0,0,.35); overflow:hidden; box-sizing:border-box; display:flex; flex-direction:column; }",
          ".pagex-header,.pagex-footer,.pagex-body { position:relative; z-index:1; box-sizing:border-box; margin-left:" + mm(pageConfig.marginLeftMm) + "; margin-right:" + mm(pageConfig.marginRightMm) + "; min-height:0; min-width:0; }",
          ".pagex-header { flex:0 0 auto; overflow:visible; padding-top:1mm; margin-top:0; margin-bottom:0; }",
          ".pagex-body { flex:0 0 auto; min-height:0; overflow:hidden; margin-top:-8px; }",

            anchorY = isNegative && isFinite(zeroY) ? zeroY : pointY;
          } else {
            var barX = Number(anchor.getAttribute("x")) || 0;
            var barWidth = Number(anchor.getAttribute("width")) || 0;
            var barY = Number(anchor.getAttribute("y")) || 0;
            var barHeight = Number(anchor.getAttribute("height")) || 0;

            if (isHorizontalBar) {
              var isStacked = anchor.dataset.stacked === "1";
              centerX = isStacked
                ? (isNegative ? barX : barX + barWidth)
                : (isFinite(zeroY) ? zeroY : (isNegative ? barX + barWidth : barX));
              anchorY = barY + barHeight / 2;
              spanViewbox = barHeight;
            } else {
              centerX = barX + barWidth / 2;
              anchorY = isNegative && isFinite(zeroY) ? zeroY : barY;
              spanViewbox = barWidth;
            }
          }

          var mapped = mapChartViewBoxToPreviewBox(svg, preview, centerX, anchorY);

          if (isHorizontalBar) {
            label.classList.add("is-horizontal-bar");
            label.style.transform = "translate(0, -50%)";
            label.style.transformOrigin = "left center";
            label.style.left = (mapped.left + (isNegative ? chartValueLabelGapPx : -chartValueLabelGapPx - label.offsetWidth)) + "px";
            label.style.top = mapped.top + "px";
          } else {
            label.style.transform = "translate(-50%, -50%) rotate(270deg)";
            label.style.transformOrigin = "center center";
            var rotatedVisualHeight = label.offsetWidth || 0;
            var offsetPx = rotatedVisualHeight / 2 + chartValueLabelGapPx;

            label.style.left = mapped.left + "px";
            label.style.top = (mapped.top - offsetPx) + "px";
          }

          var spanPx = isFinite(spanViewbox) ? spanViewbox * mapped.scale : 20 * mapped.scale;
          var bounds = label.getBoundingClientRect();
          var labelSpanPx = Math.max(bounds.width, bounds.height, 1);

          if (spanPx > 0 && (spanPx < 22 || labelSpanPx > spanPx * 1.35)) {
            label.classList.add("is-hidden");
          }
        });
      }

      function layoutChartCategoryLabels(chartBox) {
        var preview = chartBox ? chartBox.querySelector(".wordex-chart-preview") : null;
        var svg = preview ? preview.querySelector("svg") : null;
        var panel = preview ? preview.querySelector(".wordex-chart-category-labels") : null;

        if (!preview || !svg || !panel) {
          return;
        }

        Array.prototype.slice.call(panel.querySelectorAll(".wordex-chart-category-label")).forEach(function (label) {
          var x = Number(label.dataset.viewboxX);
          var y = Number(label.dataset.viewboxY);

          if (!Number.isFinite(x) || !Number.isFinite(y)) {
            return;
          }

          var mapped = mapChartViewBoxToPreviewBox(svg, preview, x, y);

          label.style.position = "absolute";
          label.style.left = mapped.left + "px";
          label.style.top = mapped.top + "px";

          if (label.dataset.horizontal === "1") {
            label.style.transform = "translate(-100%, -50%)";
            label.style.transformOrigin = "right center";
            label.style.maxWidth = "9em";
          } else {
            label.style.transform = "translate(-50%, 0)";
            label.style.transformOrigin = "center top";
          }
        });
      }

      function layoutAllChartOverlays(root) {
        if (!root) return;

        Array.prototype.slice.call(root.querySelectorAll(".wordex-chart-box")).forEach(function (chartBox) {
          layoutChartBarValueLabels(chartBox);
          layoutChartCategoryLabels(chartBox);
        });
      }

      function scheduleChartOverlayRelayout(root) {
        layoutAllChartOverlays(root);

        requestAnimationFrame(function () {
          layoutAllChartOverlays(root);

          requestAnimationFrame(function () {
            layoutAllChartOverlays(root);
          });
        });

        setTimeout(function () { layoutAllChartOverlays(root); }, 80);
        setTimeout(function () { layoutAllChartOverlays(root); }, 250);
      }

      function appendBlockClone(current, clone) {
        current.bodyFlow.appendChild(clone);
        layoutBlockChartOverlays(clone);
        tightenMainObjectBlockHeights(clone);
        return !overflows(current.body);
      }

      function markBlockTooLarge(block) {
        if (!block) {
          return;
        }

        block.classList.add("wordex-pagex-block-too-large");
        block.style.outline = "1px dashed #c00";
      }

      function tableRowKind(row) {
        return row ? String(row.getAttribute("data-row-kind") || "") : "";
      }

      function getTablePaginationPlan(rows) {
        var headerCount = 0;
        var hasKinds = false;
        var index = 0;

        for (index = 0; index < rows.length; index++) {
          if (tableRowKind(rows[index])) hasKinds = true;
        }

        if (hasKinds) {
          while (headerCount < rows.length) {
            var headerKind = tableRowKind(rows[headerCount]);
            if (headerKind !== "tableHeader" && headerKind !== "columnHeader") break;
            headerCount++;
          }
        } else if (rows.length) {
          headerCount = 1;
        }

        var footerCount = 0;

        if (hasKinds) {
          while (footerCount < rows.length - headerCount && tableRowKind(rows[rows.length - 1 - footerCount]) === "tableFooter") {
            footerCount++;
          }
        } else if (rows.length > headerCount + 1) {
          footerCount = 1;
        }

        return {
          headerCount: headerCount,
          footerCount: footerCount,
          firstMiddle: headerCount,
          lastMiddle: rows.length - footerCount - 1
        };
      }

      function rowGroupPath(row) {
        return row ? String(row.getAttribute("data-row-context-path") || "") : "";
      }

      function groupRowBreaksPage(rows, rowIndex) {
        var row = rows[rowIndex];
        if (!row || tableRowKind(row) !== "groupHeader" || row.getAttribute("data-page-break-before") !== "true") {
          return false;
        }

        var path = rowGroupPath(row);
        for (var index = 0; index < rowIndex; index++) {
          var previous = rows[index];
          if (tableRowKind(previous) === "groupHeader" && rowGroupPath(previous) === path) return true;
        }

        return false;
      }

      function closeMatchingGroup(open, path) {
        if (!open.length || !path) return false;

        for (var index = open.length - 1; index >= 0; index--) {
          if (rowGroupPath(open[index]) === path) {
            open.splice(index);
            return true;
          }
        }

        return false;
      }

      function openGroupHeaderRows(rows, beforeIndex, firstMiddle) {
        var open = [];
        var limit = Math.min(beforeIndex, rows.length);

        for (var index = firstMiddle; index < limit; index++) {
          var kind = tableRowKind(rows[index]);
          var path = rowGroupPath(rows[index]);

          if (kind === "groupHeader") {
            closeMatchingGroup(open, path);
            open.push(rows[index]);
          } else if (kind === "groupFooter") {
            closeMatchingGroup(open, path);
          }
        }

        return open;
      }

      function groupHeadersToRepeat(rows, chunkStart, firstMiddle) {
        var open = openGroupHeaderRows(rows, chunkStart, firstMiddle);
        var index = chunkStart;

        while (index < rows.length && tableRowKind(rows[index]) === "groupHeader") {
          closeMatchingGroup(open, rowGroupPath(rows[index]));
          index++;
        }

        return open;
      }

      function trimTrailingOrphanGroupHeaders(rows, chunkStart, chunkEnd) {
        var end = chunkEnd;
        while (end >= chunkStart && tableRowKind(rows[end]) === "groupHeader") {
          end--;
        }
        return end;
      }

      // Unidade indivisível: groupHeader + sub-headers consecutivos + 1º detail.
      function groupHeaderKeepUnitEnd(rows, headerIndex, lastMiddle) {
        if (!rows[headerIndex] || tableRowKind(rows[headerIndex]) !== "groupHeader") {
          return headerIndex;
        }

        var end = headerIndex;
        var index = headerIndex;

        while (index <= lastMiddle && tableRowKind(rows[index]) === "groupHeader") {
          end = index;
          index++;
        }

        if (index <= lastMiddle && tableRowKind(rows[index]) === "detail") {
          return index;
        }

        return end;
      }

      function chunkHasDetailRows(rows, firstMiddle, lastMiddle) {
        for (var index = firstMiddle; index <= lastMiddle; index++) {
          if (tableRowKind(rows[index]) === "detail") return true;
        }
        return false;
      }

      function releaseTableSliceHeight(clone) {
        clone.classList.add("wordex-table-slice");
        clone.style.height = "auto";
        clone.style.minHeight = "0";
        clone.style.maxHeight = "none";
        clone.querySelectorAll(".paragraph, .subparagraph, .object-area, .main-object").forEach(function (node) {
          node.style.height = "auto";
          node.style.minHeight = "0";
          node.style.maxHeight = "none";
          node.style.overflow = "visible";
        });
      }

      function buildTableBlockSlice(sourceBlock, firstMiddleRowIndex, lastMiddleRowIndex, includeFooter) {
        var clone = sourceBlock.cloneNode(true);
        var sourceTable = sourceBlock.querySelector("table.wordex-table");
        var targetTable = clone.querySelector("table.wordex-table");

        if (!sourceTable || !targetTable || sourceTable.rows.length < 2) {
          releaseTableSliceHeight(clone);
          return clone;
        }

        var rows = Array.prototype.slice.call(sourceTable.rows);
        var plan = getTablePaginationPlan(rows);
        var colgroup = targetTable.querySelector("colgroup");
        var tbody = document.createElement("tbody");

        targetTable.innerHTML = "";

        if (colgroup) {
          targetTable.appendChild(colgroup.cloneNode(true));
        }

        for (var headerIndex = 0; headerIndex < plan.headerCount; headerIndex++) {
          tbody.appendChild(rows[headerIndex].cloneNode(true));
        }

        // Só repete cabeçalhos de grupo se o pedaço tiver pelo menos 1 detalhe.
        // Fatia só com footer (0 detalhes) não reapresenta o grupo.
        if (
          firstMiddleRowIndex >= plan.firstMiddle &&
          firstMiddleRowIndex <= plan.lastMiddle &&
          chunkHasDetailRows(rows, firstMiddleRowIndex, lastMiddleRowIndex)
        ) {
          groupHeadersToRepeat(rows, firstMiddleRowIndex, plan.firstMiddle).forEach(function (row) {
            tbody.appendChild(row.cloneNode(true));
          });
        }

        for (var index = firstMiddleRowIndex; index <= lastMiddleRowIndex; index++) {
          if (index >= plan.firstMiddle && index <= plan.lastMiddle) {
            tbody.appendChild(rows[index].cloneNode(true));
          }
        }

        if (includeFooter) {
          for (var footerIndex = rows.length - plan.footerCount; footerIndex < rows.length; footerIndex++) {
            tbody.appendChild(rows[footerIndex].cloneNode(true));
          }
        }

        targetTable.appendChild(tbody);
        releaseTableSliceHeight(clone);
        return clone;
      }

      function ensureTableChunkFitsCurrentPage(sourceBlock, current, pages, firstMiddleRowIndex) {
        if (current.bodyFlow.children.length === 0) {
          return current;
        }

        var headerProbe = buildTableBlockSlice(sourceBlock, firstMiddleRowIndex, firstMiddleRowIndex - 1, false);

        if (tableProbeFits(current, headerProbe)) {
          return current;
        }

        current = createPage(pages);
        syncPageBodyArea(current.page);
        return current;
      }

      function paginateTableBlockRows(sourceBlock, pages, current) {
        var sourceTable = sourceBlock.querySelector("table.wordex-table");

        if (!sourceTable || sourceTable.rows.length < 2) {
          var fallback = sourceBlock.cloneNode(true);

          if (!appendBlockClone(current, fallback)) {
            if (current.bodyFlow.children.length > 0) {
              current = createPage(pages);
              syncPageBodyArea(current.page);
            }

            current.bodyFlow.appendChild(fallback);
            layoutBlockChartOverlays(fallback);
            tightenMainObjectBlockHeights(fallback);

            if (overflows(current.body)) {
              markBlockTooLarge(fallback);
            }
          }

          return current;
        }

        var plan = getTablePaginationPlan(Array.prototype.slice.call(sourceTable.rows));
        var lastMiddleRowIndex = plan.lastMiddle;
        var rowIndex = plan.firstMiddle;

        if (lastMiddleRowIndex < rowIndex) {
          current = ensureTableChunkFitsCurrentPage(sourceBlock, current, pages, rowIndex);
          var headerFooterSlice = buildTableBlockSlice(sourceBlock, rowIndex, rowIndex - 1, true);

          if (!appendBlockClone(current, headerFooterSlice) && overflows(current.body)) {
            markBlockTooLarge(headerFooterSlice);
          }

          return current;
        }

        var tableRows = Array.prototype.slice.call(sourceTable.rows);

        while (rowIndex <= lastMiddleRowIndex) {
          if (groupRowBreaksPage(tableRows, rowIndex) && current.bodyFlow.children.length > 0) {
            current = createPage(pages);
            syncPageBodyArea(current.page);
          }

          current = ensureTableChunkFitsCurrentPage(sourceBlock, current, pages, rowIndex);

          var chunkStart = rowIndex;
          var chunkEnd = chunkStart - 1;

          while (rowIndex <= lastMiddleRowIndex) {
            if (rowIndex > chunkStart && groupRowBreaksPage(tableRows, rowIndex)) {
              break;
            }

            // Header + sub-headers + 1 detalhe entram juntos; se não couber, salta de página.
            if (tableRowKind(tableRows[rowIndex]) === "groupHeader") {
              var keepEnd = groupHeaderKeepUnitEnd(tableRows, rowIndex, lastMiddleRowIndex);
              var keepProbe = buildTableBlockSlice(
                sourceBlock,
                chunkStart,
                keepEnd,
                keepEnd >= lastMiddleRowIndex
              );
              if (!tableProbeFits(current, keepProbe)) {
                break;
              }
              chunkEnd = keepEnd;
              rowIndex = keepEnd + 1;
              if (keepEnd >= lastMiddleRowIndex) {
                break;
              }
              continue;
            }

            var includeFooter = rowIndex >= lastMiddleRowIndex;
            var probe = buildTableBlockSlice(sourceBlock, chunkStart, rowIndex, includeFooter);

            if (!tableProbeFits(current, probe)) {
              break;
            }

            chunkEnd = rowIndex;
            rowIndex++;

            if (includeFooter) {
              break;
            }
          }

          chunkEnd = trimTrailingOrphanGroupHeaders(tableRows, chunkStart, chunkEnd);
          // Headers removidos do fim do chunk precisam ser reprocessados na próxima página.
          rowIndex = chunkEnd + 1;

          if (chunkEnd < chunkStart) {
            if (current.bodyFlow.children.length > 0) {
              current = createPage(pages);
              syncPageBodyArea(current.page);
              continue;
            }

            var includeFooterForced = rowIndex >= lastMiddleRowIndex;
            var forcedSlice = buildTableBlockSlice(sourceBlock, rowIndex, rowIndex, includeFooterForced);
            current.bodyFlow.appendChild(forcedSlice);
            layoutBlockChartOverlays(forcedSlice);
            tightenMainObjectBlockHeights(forcedSlice);

            if (overflows(current.body)) {
              markBlockTooLarge(forcedSlice);
            }

            rowIndex++;
            continue;
          }

          var includeFooterFinal = chunkEnd >= lastMiddleRowIndex;
          var chunk = buildTableBlockSlice(sourceBlock, chunkStart, chunkEnd, includeFooterFinal);

          if (!appendBlockClone(current, chunk) && overflows(current.body)) {
            markBlockTooLarge(chunk);
          }
        }

        return current;
      }

      function placeBlockOnPages(sourceBlock, pages, current) {
        var isTable = Boolean(sourceBlock.querySelector("table.wordex-table"));

        if (isTable && sourceBlock.querySelector("tr[data-row-kind='groupHeader'][data-page-break-before='true']")) {
          return paginateTableBlockRows(sourceBlock, pages, current);
        }

        // Blocos vazios não ocupam página sozinhos (evitam página 1 em branco).
        if (isVisuallyEmptyBlock(sourceBlock)) {
          return current;
        }

        var clone = sourceBlock.cloneNode(true);

        if (appendBlockClone(current, clone)) {
          return current;
        }

        clone.remove();

        // A tabela que não cabe inteira começa no parágrafo atual e segue na página seguinte.
        if (isTable) {
          return paginateTableBlockRows(sourceBlock, pages, current);
        }

        // Se a página só tem blocos vazios, limpa e tenta de novo na mesma página.
        var existing = Array.prototype.slice.call(current.bodyFlow.children);
        if (existing.length > 0 && existing.every(isVisuallyEmptyBlock)) {
          existing.forEach(function (node) { node.remove(); });
          clone = sourceBlock.cloneNode(true);
          if (appendBlockClone(current, clone)) {
            return current;
          }
          clone.remove();
        } else if (existing.length > 0) {
          current = createPage(pages);
          syncPageBodyArea(current.page);
          clone = sourceBlock.cloneNode(true);

          if (appendBlockClone(current, clone)) {
            return current;
          }

          clone.remove();
        }

        clone = sourceBlock.cloneNode(true);
        current.bodyFlow.appendChild(clone);
        layoutBlockChartOverlays(clone);
        tightenMainObjectBlockHeights(clone);

        if (overflows(current.body)) {
          markBlockTooLarge(clone);
        }

        return current;
      }

      function paginateBlocks(source, output) {
        var originalBody = source.querySelector(".body-flow");
        if (!originalBody) return;
        output.innerHTML = "";
        var pages = document.createElement("div");
        pages.className = "pagex-pages";
        output.appendChild(pages);
        var blocks = Array.prototype.slice.call(originalBody.children).filter(function (node) {
          return node.nodeType === 1;
        });
        var current = createPage(pages);
        syncPageBodyArea(current.page);
        blocks.forEach(function (block) {
          var isPageBreak = block.getAttribute("data-page-break-character") === "12" ||
            block.getAttribute("data-page-break-before") === "true";
          if (isPageBreak) {
            current = createPage(pages);
            syncPageBodyArea(current.page);
            return;
          }
          current = placeBlockOnPages(block, pages, current);
        });
        pruneLeadingEmptyPages(pages);
        compactAllPageBodyAreas(pages);
      }

      async function startPagex() {
        var source = document.getElementById("wordex-report-source");
        var output = document.getElementById("wordex-pagex-output");
        if (!source || !output) return;

        addPagexCss();
        await waitForResources(source);
        tightenAllMainObjectBlockHeights(source);
        paginateBlocks(source, output);
        scheduleChartOverlayRelayout(output);
        tightenAllMainObjectBlockHeights(output);
        await waitForResources(output);
        tightenAllMainObjectBlockHeights(source);
        paginateBlocks(source, output);
        scheduleChartOverlayRelayout(output);
        tightenAllMainObjectBlockHeights(output);

      function sanitizeHtmlFileName(name) {
        return String(name || "Relatorio.html").trim().replace(/[\\/:*?"<>|]+/g, "-") || "Relatorio.html";
      }

      function applyTemplatePlaceholders(template, replacements) {
        return Object.keys(replacements || {}).reduce(function (html, key) {
          return html.split("@@" + key + "@@").join(String(replacements[key] == null ? "" : replacements[key]));
        }, String(template || ""));
      }

      function applyWordexSystemPageMacros(output) {
        var pages = Array.prototype.slice.call((output || document).querySelectorAll(".pagex-page"));
        var pageCount = pages.length;
        var now = new Date();
        var values = {
          "@Today": now.toLocaleDateString(),
          "@Now": now.toLocaleString(),
          "@DateISO": now.toISOString().slice(0, 10),
          "@Time": now.toLocaleTimeString(),
          "@Year": String(now.getFullYear()),
          "@Month": String(now.getMonth() + 1).padStart(2, "0"),
          "@Day": String(now.getDate()).padStart(2, "0")
        };

        pages.forEach(function (page, index) {
          values["@PageNumber"] = String(index + 1);
          values["@PageCount"] = String(pageCount);
          replaceSystemMacrosInTree(page, values);
        });
      }

      function replaceSystemMacrosInTree(root, values) {
        var nodes = [];
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
        while (walker.nextNode()) nodes.push(walker.currentNode);
        if (!nodes.length) return;

        var combined = "";
        var map = [];
        nodes.forEach(function (node) {
          var value = String(node.nodeValue || "");
          for (var i = 0; i < value.length; i += 1) {
            map.push({ node: node, offset: i });
            combined += value.charAt(i);
          }
        });

        var expression = /\{\{[\s\u200b]*(\@[A-Za-z][A-Za-z0-9]*)[\s\u200b]*\}\}/g;
        var replacements = [];
        var match;
        while ((match = expression.exec(combined))) {
          var tag = match[1];
          if (!Object.prototype.hasOwnProperty.call(values, tag)) continue;
          replacements.push({
            start: match.index,
            end: match.index + match[0].length,
            value: String(values[tag])
          });
        }

        for (var index = replacements.length - 1; index >= 0; index -= 1) {
          var replacement = replacements[index];
          var start = map[replacement.start];
          var end = map[replacement.end - 1];
          if (!start || !end) continue;
          var range = document.createRange();
          range.setStart(start.node, start.offset);
          range.setEnd(end.node, end.offset + 1);
          range.deleteContents();
          range.insertNode(document.createTextNode(replacement.value));
        }
      }

      function resolveMappedImageDataUrl(src, map) { return map && map[src] ? map[src] : ""; }
      function rasterizeLoadedImageElement() { return ""; }
      function isProbablyCrossOriginUrl(src) { return /^https?:\/\//i.test(String(src || "")); }
      async function fetchImageAsDataUrl() { return ""; }
      async function loadImageAsDataUrl() { return ""; }
      function omitUnembeddableImage(img) { if (img) img.removeAttribute("src"); }

      function collectReportStyles() {
        var styleNode = document.getElementById("wordex-report-styles");
        return styleNode ? styleNode.textContent + "\n" : "";
      }

      function readPagexConfig() {
        try {
          return JSON.parse(document.getElementById("wordex-pagex-config").textContent || "{}") || {};
        } catch (error) {
          return {};
        }
      }

      function saveMountedHtml() {
        if (!document.body.classList.contains("wordex-pagex-ready")) {
          alert("Aguarde a paginação terminar.");
          return;
        }

        var pagexOutput = document.getElementById("wordex-pagex-output");
        scheduleChartOverlayRelayout(pagexOutput);
        var config = readPagexConfig();
        var fileName = sanitizeHtmlFileName(config.htmlFileName || "Relatorio.html");
        var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        var blob = new Blob([html], { type: "text/html;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");

        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 1000);

        setPagedStatus("HTML salvo: " + fileName);
      }

      async function preparePagexHtmlForPdf(root, imageDataUrlMap) {
        if (!root) return "";

        var clone = root.cloneNode(true);
        var liveImgs = root.querySelectorAll("img");
        var cloneImgs = clone.querySelectorAll("img");
        var tasks = [];

        for (var i = 0; i < liveImgs.length; i++) {
          (function (liveImg, cloneImg) {
            if (!cloneImg) return;

            tasks.push((async function () {
              var src = String(cloneImg.getAttribute("src") || liveImg.currentSrc || liveImg.src || "").trim();
              var mappedDataUrl = resolveMappedImageDataUrl(src, imageDataUrlMap);

              if (mappedDataUrl) {
                cloneImg.setAttribute("src", mappedDataUrl);
                cloneImg.removeAttribute("crossorigin");
                return;
              }

              var dataUrl = rasterizeLoadedImageElement(liveImg);
              if (dataUrl) {
                cloneImg.setAttribute("src", dataUrl);
                cloneImg.removeAttribute("crossorigin");
                return;
              }

              if (!src || src.indexOf("data:") === 0) return;

              if (isProbablyCrossOriginUrl(src)) {
                var fetchedDataUrl = await fetchImageAsDataUrl(src);
                if (fetchedDataUrl) {
                  cloneImg.setAttribute("src", fetchedDataUrl);
                  cloneImg.removeAttribute("crossorigin");
                  return;
                }

                omitUnembeddableImage(cloneImg, src);
                return;
              }

              var corsDataUrl = await loadImageAsDataUrl(src, true);
              if (corsDataUrl) {
                cloneImg.setAttribute("src", corsDataUrl);
                cloneImg.removeAttribute("crossorigin");
                return;
              }

              omitUnembeddableImage(cloneImg, src);
            })());
          })(liveImgs[i], cloneImgs[i]);
        }

        await Promise.all(tasks);
        return clone.innerHTML;
      }

      async function buildPdfViewerHtml(options) {
        var template = window.WORDEX_PDF_TEMPLATE;
        if (!template) {
          throw new Error("Template PDF indisponível. Volte ao editor e clique em Montar HTML novamente.");
        }

        var templateHelpers = [
          "function sanitizeFileName(name) {",
          "  var value = String(name || 'Relatorio.pdf').trim().replace(/[/:*?\"<>|]/g, '-');",
          "  value = value.split(String.fromCharCode(92)).join('-');",
          "  return value || 'Relatorio.pdf';",
          "}",
          "function resolveMappedImageDataUrl(src, map) { return map && map[src] ? map[src] : ''; }",
          "function rasterizeLoadedImageElement() { return ''; }",
          "function isProbablyCrossOriginUrl(src) { return /^https?:\\/\\//i.test(String(src || '')); }",
          "async function fetchImageAsDataUrl() { return ''; }",
          "async function loadImageAsDataUrl() { return ''; }",
          "function omitUnembeddableImage(img, src, skipped) {",
          "  if (src && skipped && skipped.indexOf(src) === -1) skipped.push(src);",
          "  if (img) { img.removeAttribute('src'); img.removeAttribute('crossorigin'); img.style.visibility = 'hidden'; img.style.display = 'none'; }",
          "}"
        ].join("\n");
        template = template.replace("/*WORDEX_TEMPLATE_HELPERS*/", templateHelpers);
        template = template.replace(/<button\b(?=[^>]*\bid=["']wordex-pdf-print["'])[^>]*>[\s\S]*?<\/button>/i, "");
        template = template.replace(
          "A geração está demorando. Use Imprimir para gerar PDF pelo navegador ou tente Salvar PDF novamente após concluir.",
          "A geração está demorando. Aguarde antes de tentar Salvar PDF novamente."
        );

        if (!document.body.classList.contains("wordex-pagex-ready")) {
          throw new Error("Aguarde a paginação terminar.");
        }

        options = options || {};
        var pagexOutput = document.getElementById("wordex-pagex-output");
        var pagexStyle = document.getElementById("wordex-pagex-style");
        var config = readPagexConfig();
        var pdfTitle = String(config.pdfTitle || document.title || "Relatório Wordex").trim();
        var pdfFileName = String(config.pdfFileName || "Relatorio.pdf").trim();
        var imageDataUrlMap = config.imageDataUrlMap || {};
        var pdfConfig = JSON.stringify({
          fileName: pdfFileName,
          title: pdfTitle,
          imageDataUrlMap: imageDataUrlMap,
          returnBase64: !!options.returnBase64
        }).split("<\/").join("<\\/");

        var pagexHtml = "";

        if (pagexOutput) {
          scheduleChartOverlayRelayout(pagexOutput);
          await waitForImages(pagexOutput, 10000);
          pagexHtml = await preparePagexHtmlForPdf(pagexOutput, imageDataUrlMap);
        }

        return applyTemplatePlaceholders(template, {
          WORDEX_TITLE: pdfTitle,
          WORDEX_PDF_CONFIG: pdfConfig,
          WORDEX_PAGEX_HTML: pagexHtml,
          WORDEX_PAGEX_STYLE: pagexStyle ? pagexStyle.textContent : "",
          WORDEX_REPORT_STYLES: collectReportStyles()
        });
      }

      async function openPdfViewerTab() {
        try {
          var html = await buildPdfViewerHtml();
          var blob = new Blob([html], { type: "text/html;charset=utf-8" });
          var url = URL.createObjectURL(blob);
          var opened = window.open(url, "_blank");

          if (!opened) {
            window.location.href = url;
          }
        } catch (error) {
          alert(error.message);
        }
      }

      window.wordexBuildPdfHtml = buildPdfViewerHtml;

      function bindPagedToolbarActions() {
        var saveHtmlButton = document.getElementById("wordex-paged-save-html");
        var printButton = document.getElementById("wordex-paged-print");
        var pdfButton = document.getElementById("wordex-paged-pdf");
        var closeButton = document.getElementById("wordex-paged-close");

        if (saveHtmlButton) {
          saveHtmlButton.addEventListener("click", saveMountedHtml);
        }

        if (printButton) {
          printButton.addEventListener("click", function () {
            if (!document.body.classList.contains("wordex-pagex-ready")) {
              alert("Aguarde a paginação terminar.");
              return;
            }
            window.print();
          });
        }

        if (pdfButton) {
          pdfButton.addEventListener("click", function () {
            openPdfViewerTab().catch(function (error) {
              alert("Erro ao gerar PDF: " + error.message);
            });
          });
        }

        if (closeButton) {
          closeButton.addEventListener("click", function () {
            window.close();
          });
        }
      }

      function initPagedDocument() {
        bindPagedToolbarActions();
        if (alreadyPaged) {
          document.body.classList.add("wordex-pagex-ready");
          var pageCount = document.querySelectorAll("#wordex-pagex-output .pagex-page").length;
          setPagedStatus(pageCount === 1 ? "1 página pronta." : pageCount + " páginas prontas.");
          var pdfButton = document.getElementById("wordex-paged-pdf");
          var printButton = document.getElementById("wordex-paged-print");
          var saveHtmlButton = document.getElementById("wordex-paged-save-html");
          if (pdfButton) pdfButton.disabled = false;
          if (printButton) printButton.disabled = false;
          if (saveHtmlButton) saveHtmlButton.disabled = false;
        } else {
          startPagex();
        }
      }

      initPagedDocument();
    };

    (function connectToWordex() {
      var started = false;
      var readyTimer = null;
      var source = document.getElementById("wordex-report-source");
      var configNode = document.getElementById("wordex-pagex-config");
      var statusNode = document.getElementById("wordex-paged-status");
      var atRuleNode = document.getElementById("wordex-page-at-rule-runtime");

      function setPageConfiguration(config) {
        var page = config.pageConfig || {};
        var width = String(page.width || "210mm");
        var height = String(page.height || "297mm");
        document.documentElement.style.setProperty("--wordex-page-width", width);
        document.documentElement.style.setProperty("--wordex-page-height", height);
        document.documentElement.style.setProperty("--wordex-margin-left", Math.max(0, Number(page.marginLeftMm) || 14) + "mm");
        document.documentElement.style.setProperty("--wordex-margin-right", Math.max(0, Number(page.marginRightMm) || 14) + "mm");
        if (atRuleNode) atRuleNode.textContent = "@page { size: " + width + " " + height + "; margin: 0; }";
        document.title = String(config.pdfTitle || "Relatório Wordex");
        var titleNode = document.getElementById("wordex-paged-title");
        if (titleNode) titleNode.textContent = document.title;
      }

      function start(config, sourceHtml, alreadyPaged) {
        if (started) return;
        started = true;
        if (readyTimer) clearInterval(readyTimer);
        setPageConfiguration(config);
        if (configNode) configNode.textContent = JSON.stringify(config || {});
        if (!alreadyPaged && source) source.innerHTML = String(sourceHtml || "");
        if (statusNode && !alreadyPaged) statusNode.textContent = "Paginando relatório...";
        window.initializeWordexPaged(config, alreadyPaged);
      }

      function announceReady() {
        if (started || !window.opener) return;
        window.opener.postMessage({ type: "wordex-paged-ready" }, "*");
      }

      window.addEventListener("message", function (event) {
        if (!window.opener || event.source !== window.opener || event.data?.type !== "wordex-paged-render") return;
        var payload = event.data.payload || {};
        start(payload.config || {}, payload.sourceHtml || "", false);
      });

      var savedOutput = document.querySelector("#wordex-pagex-output .pagex-page");
      if (document.body.classList.contains("wordex-pagex-ready") && savedOutput) {
        var savedConfig = {};
        try { savedConfig = JSON.parse(configNode?.textContent || "{}"); } catch (_) {}
        start(savedConfig, "", true);
        return;
      }

      if (window.opener) {
        announceReady();
        readyTimer = setInterval(announceReady, 300);
      } else if (statusNode) {
        statusNode.textContent = "Abra esta página pelo botão Renderizar do Wordex.";
      }
    }());
  </script>
  </body>
