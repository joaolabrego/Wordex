<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordex PDF</title>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #333;
      background: #f2f4f7;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #status {
      max-width: 520px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    #status.error {
      color: #a12622;
    }
  </style>
</head>
<body>
  <div id="status">Aguardando o relatório paginado do Wordex...</div>
  <script>
    "use strict";

    (function () {
      var status = document.getElementById("status");
      var opener = window.opener;

      if (!opener) {
        status.textContent = "Abra esta página pelo botão PDF do Wordex.";
        return;
      }

      function announceReady() {
        if (!window.opener) return;
        window.opener.postMessage({ type: "wordex-pdf-ready" }, "*");
      }

      window.addEventListener("message", function (event) {
        if (!window.opener || event.source !== window.opener) return;

        if (event.data?.type === "wordex-pdf-error") {
          status.classList.add("error");
          status.textContent = "Erro ao preparar o PDF: " + String(event.data.message || "Erro desconhecido.");
          return;
        }

        if (event.data?.type !== "wordex-pdf-document" || typeof event.data.html !== "string") return;

        var html = event.data.html;
        if (!/^\s*<!doctype html/i.test(html)) {
          status.classList.add("error");
          status.textContent = "O Wordex enviou um documento PDF inválido.";
          return;
        }

        window.clearInterval(readyTimer);
        document.open();
        document.write(html);
        document.close();
      });

      var readyTimer = window.setInterval(announceReady, 300);
      announceReady();
    }());
  </script>
</body>
</html>
